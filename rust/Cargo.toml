[package]
name = "brevity-actor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
regex = "1"

[profile.dev]
strip = true
# No debug info: strip drops it from the binary anyway, and on macOS it keeps each
# build's object files in target/debug/deps, which are never cleaned up.
debug = false
